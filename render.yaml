services:
  - type: web
    name: esseycheckerbot
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DAILY_USER_LIMIT
        value: "5"
      - key: DAILY_GROUP_LIMIT
        value: "50"
      - key: ADMIN_IDS
        value: "7326292681"
